# Forwarding headers and websocket support for every proxied app
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# Always overwritten, so a client can never claim to be someone else. Empty if the request is not authenticated.
proxy_set_header X-Homepie-User $homepie_user;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $homepie_connection_upgrade;

proxy_connect_timeout 5s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
