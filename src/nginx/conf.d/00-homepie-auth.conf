# Http level pieces of the authentication, used by homepie.conf

# The auth server (src/server/homepie_auth). `deploy nginx` writes HOMEPIE_AUTH_HOST:HOMEPIE_AUTH_PORT from .env into the
# marked line, so that the port is only configured in one place.
upstream homepie_auth {
    server 127.0.0.1:8000; # homepie-auth-upstream
    keepalive 8;
}

# At most 10 login attempts per minute and client on top of the limits inside the auth server
limit_req_zone $binary_remote_addr zone=homepie_login:10m rate=10r/m;

# The session cookie is valid for all of *.homepie.net, so every app would receive it. Apps get the login name in
# the X-Homepie-User header instead and never see the token itself.
map $http_cookie $homepie_app_cookie {
    default "$http_cookie";
    "~^homepie_session=[^;]*(?:;\s*)?(?<rest>.*)$"                              "$rest";
    "~^(?<before>.*?);\s*homepie_session=[^;]*;\s*(?<after>.*)$"                "$before; $after";
    "~^(?<before>.*?);\s*homepie_session=[^;]*$"                                "$before";
}
