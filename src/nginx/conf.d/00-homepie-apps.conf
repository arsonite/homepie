# App registry: <name> -> <upstream host:port>
#
# To publish a new app at https://homepie.net/<name>/ add ONE line below and run `deploy nginx`.
# The app has to be built for that base path (vite: `base: '/<name>/'`), nginx passes the path on unchanged.
# Apps must only listen on 127.0.0.1, nginx is the only thing that is exposed to the internet.
map $homepie_app $homepie_upstream {
    default     "";                 # Unknown app -> client-side route of homepie

    lockkliye   127.0.0.1:8101;     # https://homepie.net/lockkliye/
    # namegen     127.0.0.1:8102;
    # quickquill  127.0.0.1:8103;
}

# Required to proxy websockets (Vite HMR, Django channels, ...)
map $http_upgrade $homepie_connection_upgrade {
    default upgrade;
    ""      close;
}
