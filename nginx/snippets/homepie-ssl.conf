# Wildcard certificate (homepie.net + *.homepie.net) issued by `install-ssl`
ssl_certificate /etc/letsencrypt/live/homepie.net/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/homepie.net/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:homepie_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
