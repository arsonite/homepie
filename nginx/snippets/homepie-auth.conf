# Include at server level: every location of that server requires a valid session (secure by default).
# Locations that must be public (login page, its assets) switch it off with `auth_request off;`.
#
# If the auth server is down, nginx answers 500 and nothing gets through (fails closed).
auth_request /_homepie_auth;
auth_request_set $homepie_user $upstream_http_x_auth_user;

location = /_homepie_auth {
    internal;
    auth_request off; # Otherwise the check would check itself

    proxy_pass http://homepie_auth/api/auth/verify;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}
