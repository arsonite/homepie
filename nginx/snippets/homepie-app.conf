# The locations of https://<app>.homepie.net, included in the server block of homepie.conf (after the authentication).
#
# Production or dev, decided per request by the files: while dist/ of the app (00-homepie-apps.conf, $homepie_static)
# has an index.html nginx serves that build, without it everything goes to the dev server of the app
# ($homepie_upstream). Building puts dist/ there, starting the dev server removes it, nothing has to be reloaded.
# The data of the app (/hsdb/) always goes straight to its HSDB server ($homepie_api).

gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

# PWA files are public, browsers fetch the manifest and icons without cookies (and a redirect to the lockscreen
# would break the service worker update). Never cached without asking: a new service worker must be found at once.
location ~ ^/(manifest\.json|sw\.js|favicon\.(svg|ico)|icons/) {
    auth_request off;

    include snippets/homepie-security.conf; # add_header is not inherited into locations that define their own
    add_header Cache-Control "no-cache";

    root $homepie_static;
    try_files $uri @homepie_dev_public;
}

location @homepie_dev_public {
    auth_request off;

    if ($homepie_upstream = "") {
        return 404;
    }

    proxy_pass http://$homepie_upstream; # Variable without URI: request URI is passed through unchanged
    include snippets/homepie-proxy.conf;
    proxy_set_header Cookie "";
}

# The HSDB server of the app: the api of the production build (the dev server proxies it to the same place)
location ^~ /hsdb/ {
    if ($homepie_api = "") {
        return 404;
    }

    proxy_pass http://$homepie_api;
    include snippets/homepie-proxy.conf;
    proxy_set_header Cookie $homepie_app_cookie;
}

# Vite emits hashed filenames, so these can be cached forever
location ^~ /assets/ {
    include snippets/homepie-security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";

    root $homepie_static;
    try_files $uri @homepie_app;
}

# The build: files, and the entry point for everything else (client-side routes), never cached without asking.
# Without a build the request continues in @homepie_app, the dev server. That happens after the authentication, so
# unauthenticated visitors cannot tell known from unknown subdomains.
location / {
    include snippets/homepie-security.conf;
    add_header Cache-Control "no-cache";

    root $homepie_static;
    try_files $uri /index.html @homepie_app;
}

location @homepie_app {
    if ($homepie_upstream = "") {
        return 404;
    }

    proxy_pass http://$homepie_upstream;
    include snippets/homepie-proxy.conf;
    proxy_set_header Cookie $homepie_app_cookie;
}
