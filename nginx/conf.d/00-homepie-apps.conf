# App registry: <subdomain> -> <upstream host:port>
#
# To publish a new app at https://<name>.homepie.net add ONE line below and run `deploy nginx`.
# DNS needs no change, because the wildcard record *.homepie.net already points at this server.
# The app runs on / (no base path). Apps must only listen on 127.0.0.1, nginx is the only thing that is exposed to the internet.
map $homepie_app $homepie_upstream {
    default     "";                 # Unknown subdomain -> 404

    lockkliye   127.0.0.1:8101;     # https://lockkliye.homepie.net
    tickfit     127.0.0.1:8104;     # https://tickfit.homepie.net
    # namegen     127.0.0.1:8102;
    # quickquill  127.0.0.1:8103;
}

# Where the production build of each app is: dist/ of its checkout. While it has an index.html nginx serves it, without
# it the app goes to the dev server above (`start build` puts it there, `start client` removes it, nothing to reload).
# nginx (www-data) must be able to read the directory.
map $homepie_app $homepie_static {
    default     /var/empty/none; # does not exist, so there is no build

    lockkliye   /usr/local/src/lockkliye/dist;
    tickfit     /usr/local/src/tickfit/dist;
}

# The HSDB server of each app (<APP>_PORT in its .env). The production build has no dev server to proxy /hsdb/.
map $homepie_app $homepie_api {
    default     "";

    lockkliye   127.0.0.1:8765;
    tickfit     127.0.0.1:8767;
}

# Required to proxy websockets (Vite HMR, Django channels, ...)
map $http_upgrade $homepie_connection_upgrade {
    default upgrade;
    ""      close;
}
