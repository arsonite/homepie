# Installed to /etc/nginx/conf.d/homepie.conf by `deploy nginx`.
# Requires the wildcard certificate from `install-ssl` and the app registry in 00-homepie-apps.conf.

# http -> https
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# Anything that is not homepie.net or a subdomain of it (e.g. direct access by IP)
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    include snippets/homepie-ssl.conf;

    return 444; # Close the connection without a response
}

# www.homepie.net -> homepie.net
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.homepie.net;

    include snippets/homepie-ssl.conf;

    return 301 https://homepie.net$request_uri;
}

# https://homepie.net -> landing page (lockscreen + app tiles) and its API
#
# Everything requires a session except what the lockscreen itself needs: its page shell, its assets and the login API.
# The shell is the same bundle for all client-side routes, but the server only hands it out under /login without a
# session, every other path redirects to /login. All data comes from /api, which is authenticated.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name homepie.net;

    include snippets/homepie-ssl.conf;
    include snippets/homepie-security.conf;
    include snippets/homepie-auth.conf;

    root /var/www/homepie/client;
    index index.html;

    client_max_body_size 100M;

    # Login, logout and session check of the auth server, necessarily public
    location /api/auth/ {
        auth_request off;
        proxy_pass http://homepie_auth;
        include snippets/homepie-proxy.conf;
    }

    location = /api/auth/login {
        auth_request off;
        limit_req zone=homepie_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://homepie_auth;
        include snippets/homepie-proxy.conf;
    }

    # Any other API of the homepie backend, requires a session
    location /api/ {
        proxy_pass http://homepie_auth;
        include snippets/homepie-proxy.conf;
    }

    # Vite emits hashed filenames, so these can be cached forever
    location /assets/ {
        auth_request off;
        include snippets/homepie-security.conf; # add_header is not inherited into locations that define their own
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Icons, images and sounds of the lockscreen, not hashed
    location /static/ {
        auth_request off;
        include snippets/homepie-security.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # PWA metadata and icons, browsers fetch them without cookies
    location ~ ^/(favicon\.ico|manifest\.json|robots\.txt|icons/) {
        auth_request off;
        include snippets/homepie-security.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # The lockscreen
    location = /login {
        auth_request off;
        include snippets/homepie-security.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Single page app: never cache the entry point, fall back to it for client-side routes
    location / {
        include snippets/homepie-security.conf;
        add_header Cache-Control "no-cache";
        error_page 401 = @homepie_to_login;
        try_files $uri /index.html;
    }

    location @homepie_to_login {
        return 302 https://homepie.net/login;
    }
}

# https://<app>.homepie.net -> app registered in 00-homepie-apps.conf
# Exact server_names above win over this regex, so homepie.net and www never end up here.
#
# Every request needs the session from the lockscreen. Without it the browser is sent to the lockscreen, which sends it
# back to the app after the login. Apps that listen on 127.0.0.1 therefore never see an anonymous request, and get
# the login name in the X-Homepie-User header.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<homepie_app>[a-z0-9-]+)\.homepie\.net$;

    include snippets/homepie-ssl.conf;
    include snippets/homepie-security.conf;
    include snippets/homepie-auth.conf;

    client_max_body_size 100M;

    error_page 401 = @homepie_to_login;

    # Never matches a file, so the request always continues in @homepie_app. That happens after the
    # authentication, so unauthenticated visitors cannot tell known from unknown subdomains.
    location / {
        try_files /.homepie-no-such-file @homepie_app;
    }

    location @homepie_app {
        if ($homepie_upstream = "") {
            return 404;
        }

        proxy_pass http://$homepie_upstream; # Variable without URI: request URI is passed through unchanged
        include snippets/homepie-proxy.conf;
        proxy_set_header Cookie $homepie_app_cookie;
    }

    location @homepie_to_login {
        return 302 https://homepie.net/login?app=$homepie_app;
    }
}
